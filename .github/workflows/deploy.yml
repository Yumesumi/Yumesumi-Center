name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 GitHub 界面手动触发
  workflow_dispatch:

# 授予部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，避免并发写入
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与 package.json 的 engines 要求一致（Astro 7 需要 Node >= 22.23.4）
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # 把构建产物作为 artifact 上传，供部署 job 使用
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
